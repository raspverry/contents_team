[project]
name = "contents-team"
version = "0.1.0"
description = "재테크는 스크루지 — AI 콘텐츠 팀 운영 시스템"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.79.0",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "streamlit>=1.54.0",
    "uvicorn>=0.40.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
api = "src.api.server:main"
